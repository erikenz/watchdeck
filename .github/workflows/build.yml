name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  check:
    name: Check, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format check and typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Smoke test (app launches and loads youtube.com)
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        with:
          run: pnpm test

      # PRD §R8: the upstream project's identity must not reappear anywhere.
      - name: Upstream identity gate
        run: bash tools/identity-gate.sh
